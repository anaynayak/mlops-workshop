[project]
name = "mlops-workshop"
version = "0.1.0"
description = "MLOps workshop using NYC Taxi data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "mlflow",
    "joblib",
    "plotly",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_workshop"]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
]
feature-store = [
    "fastapi>=0.135.1",
    "feast>=0.64.0",
    "uvicorn>=0.34.0",
]

[tool.poe.tasks]
setup  = { cmd = "uv sync", help = "Install base dependencies with uv" }
setup-feature-store = { cmd = "uv sync --group feature-store", help = "Add feature-store (feast) dependencies" }
data   = { cmd = "python scripts/get_data.py", help = "Download dataset from WORKSHOP_SAMPLE_URL" }
sample = { cmd = "python scripts/sample_data.py", help = "Create a 10% sample of the full dataset" }
lab    = { cmd = "marimo edit notebooks/ --watch", help = "Launch marimo notebooks" }
train  = { cmd = "python scripts/train.py", help = "Run the training script" }
infer  = { cmd = "python scripts/infer.py", help = "Run the batch inference script" }
test   = { cmd = "pytest -v", help = "Run the test suite" }
mlflow = { cmd = "mlflow ui --backend-store-uri sqlite:///mlruns/mlflow.db", help = "Launch the MLflow UI" }
slides = { cmd = "npm run dev", cwd = "slides", help = "Launch the Slidev deck" }
