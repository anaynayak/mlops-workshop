name: Deploy slides to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/slides-pages.yml
      - slides/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: slides/pnpm-lock.yaml

      - name: Install slide dependencies
        working-directory: slides
        run: pnpm install --frozen-lockfile

      - name: Install Playwright system dependencies
        working-directory: slides
        run: pnpm exec playwright install-deps chromium

      - name: Build Slidev deck
        working-directory: slides
        run: pnpm run build -- --base "${{ steps.pages.outputs.base_path }}/"

      - name: Export deck to PDF
        working-directory: slides
        run: pnpm exec slidev export --output dist/mlops-workshop.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlops-workshop-pdf
          path: slides/dist/mlops-workshop.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: slides/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
